# electron-builder configuration for the TCE Electron launcher.
#
# Produces a distributable binary for the host platform (Windows NSIS primary
# for Steam; Linux/macOS best-effort). No publish configuration — this repo
# is private and binaries are uploaded to Steam manually (`--publish never`
# in the npm scripts). Steam itself manages updates, so no auto-update is
# configured.
#
# The packaged app contains only the built renderer (dist/), the compiled
# main process + preload (dist-electron/), and package.json (for version
# metadata). Phaser and all game code are bundled into dist/ by Vite; the
# Electron runtime itself is provided by electron-builder.

appId: com.thewizardscode.tableaucardengine
productName: Tableau Card Engine
copyright: Copyright © 2026 TheWizardsCode

directories:
  output: release
  buildResources: build

# Application icon (CG-0MUTTXRWZ009NUB9). The source-of-truth is the tracked
# tableau emblem `public/favicon.svg`; `build/icon.png` (1024x1024) is
# generated from it by `npm run generate:icons`, which every `package*` script
# runs first (build/ is gitignored, so the resource never exists otherwise).
# electron-builder derives the Windows `.ico` and macOS `.icns` from this
# >=512px PNG, so no additional packer dependency is required.
icon: build/icon.png

# The packaged app loads its content from inside the asar (see
# electron/content-locator.ts: bundledDir = <asar>/dist). The renderer and
# Phaser are fully bundled into dist/ by Vite, and the Electron runtime is
# provided by electron-builder — so no node_modules are needed at runtime,
# with one exception: the optional Steamworks native module (F3,
# CG-0MSMAJQQT004SDCC).
#
# `steamworks.js` is a normal package.json dependency (it ships prebuilt
# binaries and has no install-time build hook, so non-Steam dev/CI installs
# need no native toolchain). The globs below pick it up and unpack the native
# binaries from the asar so the Steam client can load them. If the module or
# Steam itself is unavailable the launcher still runs — the Steam feature
# degrades gracefully (intake AC5).
files:
  - dist/**
  - dist-electron/**
  - package.json
  - 'node_modules/steamworks.js/**'
  - 'node_modules/tce-steam-friends/**'
  - '!node_modules/!(steamworks.js|tce-steam-friends)/**'

# Native .node/.dll artefacts cannot be loaded from inside an asar archive.
# `steamworks.js` ships its own binaries; `tce-steam-friends` is the Option A
# follow-detection addon staged by `npm run build:steam-friends`.
asarUnpack:
  - 'node_modules/steamworks.js/dist/**'
  - 'node_modules/tce-steam-friends/**/*.node'

asar: true

win:
  # NSIS installer + win-unpacked directory (primary Steam artifact).
  icon: build/icon.png
  target:
    - nsis

nsis:
  oneClick: false
  # Emblem-derived installer/uninstaller icons (CG-0MUTTXRWZ009NUB9).
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
  # perMachine: true makes the installer require admin elevation
  # (RequestExecutionLevel admin), which is needed for two reasons:
  #   1. The user installs to Program Files (requires admin anyway).
  #   2. An elevated installer can force-kill zombie/orphaned Electron
  #      processes left over from previous sessions (the standard
  #      non-elevated taskkill is username-filtered and cannot kill them,
  #      producing the "Tableau Card Engine cannot be closed" error).
  # The aggressive pre-kill lives in nsis/installer.nsh (!macro customInit);
  # the default running-instance check stays as a safety net.
  perMachine: true
  include: nsis/installer.nsh
  allowToChangeInstallationDirectory: true
  artifactName: TCE-Setup-${version}.${ext}

linux:
  icon: build/icon.png
  target:
    - AppImage
    - tar.gz
  category: Game
  artifactName: TCE-${version}.${ext}

mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.games
  artifactName: TCE-${version}.${ext}
