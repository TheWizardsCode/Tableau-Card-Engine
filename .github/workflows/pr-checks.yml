# PR quality gate: build check on every pull request.
#
# CI gates on the BUILD ONLY (TypeScript compile + Vite bundle). The full test
# suite (unit + browser + tutorial E2E) is run LOCALLY by developers before
# every push (see AGENTS.md quality gates) and is intentionally NOT re-run in
# PR CI: the Phaser 4 browser suite has outgrown the single-Chromium-instance
# context budget (~8 game create/destroy cycles per process) and is reliably
# hard-killed in the constrained CI environment (see CG-0MT022826006EM0D).
# deploy.yml on main also builds only; package.yml smoke-tests the packaged
# Windows binary separately.
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
