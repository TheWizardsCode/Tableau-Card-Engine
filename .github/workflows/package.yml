# Build and package the Windows binary (primary Steam artifact).
#
# Runs on push to main and version tags (and manually via workflow_dispatch).
# Windows is the primary Steam target; the Linux/macOS dev machines cannot
# produce it, so CI builds it reproducibly. The GitHub Pages deploy workflow
# (deploy.yml) is intentionally untouched.
#
# The artifact ships the FULL distribution (all games + Gym): the core repo
# carries no games at HEAD (multi-repo architecture), so the game repos are
# composed as sibling checkouts (`../tce-<game>`) before packaging
# (CG-0MULGC6VP008GPH2). GAMES_CONFIG=full is set at job level so both the
# packaging build and the launch smoke test use the same preset.
#
# Artifact: NSIS installer (TCE-Setup-<version>.exe). Before upload, the
# win-unpacked binary is smoke-tested in-job via the Playwright-Electron
# launch test (tests/electron/launch-smoke.test.ts, TCE_SMOKE_BINARY mode),
# which asserts the selector catalogue matches the configured preset.
name: Package Windows Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    env:
      # Ship every game in the Steam artifact. The launch smoke test derives
      # its expected catalogue size from this same preset.
      GAMES_CONFIG: full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose sibling game repositories
        shell: bash
        run: |
          set -euo pipefail
          # The core repo carries no games at HEAD (multi-repo architecture);
          # the distribution composes the game repos as siblings. Each preset
          # entry's `path` (e.g. `../tce-golf`) is exactly where the Vite
          # discovery plugin looks, so `configs/full.json` is the single source
          # of truth for the composed set. The game repos are public, so the
          # clone needs no credentials; their own `./core` submodule is not
          # needed here because the launcher resolves core aliases locally.
          for repo in $(node -e "for (const g of require('./configs/full.json').games) console.log(g.path)"); do
            git clone --depth 1 "https://github.com/TheWizardsCode/${repo#../}.git" "$repo"
          done

      - name: Package Windows binary
        run: npm run package:win

      - name: Smoke test packaged binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release\win-unpacked\*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No executable found in release\win-unpacked" }
          $env:TCE_SMOKE_BINARY = $exe.FullName
          npx vitest run --project electron

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tce-windows-installer
          path: release/TCE-Setup-*.exe
          if-no-files-found: error

  promote-release:
    # Promote the freshly built installer to a DRAFT GitHub Release (the
    # operator reviews and publishes it in the UI — this never publishes).
    # Runs only on version-tag pushes (the ship skill's dev→main release),
    # after package-windows has uploaded the artifact.
    #
    # Non-blocking by design: a promotion failure must not fail the workflow
    # (the Pages deploy is a separate workflow and the artifact is already
    # uploaded). The operator always has the manual fallback
    # `/skill:release-windows`.
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write # create the draft release (and reuse the v* tag)
      actions: read # download the tce-windows-installer artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-flight promotion (dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read-only pre-flight: resolve the pinned run, derive the version
          # from package.json, confirm the tce-windows-installer artifact is
          # attached, and print the exact commands the real step will run.
          # Fails fast (before the real step) when the artifact is missing.
          node .pi/skills/release-windows/scripts/promote-windows-release.mjs \
            --dry-run --run-id "${{ github.run_id }}"

      - name: Promote Windows installer to draft release
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pin to *this* run: on a tag push the current run is still
          # `in_progress`, so the script's "latest successful run"
          # auto-resolve would otherwise pick the previous release's
          # artifact (the job itself keeps the run in progress).
          node .pi/skills/release-windows/scripts/promote-windows-release.mjs \
            --run-id "${{ github.run_id }}"

      - name: Summarise promotion result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.promote.outcome }}" = "success" ]; then
            {
              echo "### Windows release promotion"
              echo ""
              echo "Draft release created (or already existed). Review and publish it in the GitHub UI."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Windows release promotion failed. Run /skill:release-windows manually; see the 'Promote Windows installer to draft release' step log."
            {
              echo "### Windows release promotion"
              echo ""
              echo "Promotion failed — run \`/skill:release-windows\` manually. See the step log for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
