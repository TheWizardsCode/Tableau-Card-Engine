<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="190" viewBox="0 0 140 190">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pattern-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5a8c;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3a7ab8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <!-- Card background with rounded corners -->
  <rect x="1" y="1" width="138" height="188" rx="6" ry="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="3" y="3" width="134" height="184" rx="5" ry="5" fill="url(#bg-grad)" />
  <!-- Outer border -->
  <rect x="6" y="6" width="128" height="178" rx="4" ry="4" fill="none" stroke="#4a8acc" stroke-width="1" opacity="0.5"/>
  <!-- Diamond pattern -->
  <g fill="url(#pattern-grad)" stroke="none">
    <polygon points="70,30 85,55 70,80 55,55" />
    <polygon points="70,110 85,135 70,160 55,135" />
    <polygon points="30,55 45,80 30,105 15,80" />
    <polygon points="110,55 125,80 110,105 95,80" />
  </g>
  <!-- Small corner diamonds -->
  <g fill="none" stroke="#5a9adc" stroke-width="0.5" opacity="0.4">
    <polygon points="70,20 78,30 70,40 62,30" />
    <polygon points="70,150 78,160 70,170 62,160" />
    <polygon points="20,55 28,65 20,75 12,65" />
    <polygon points="120,55 128,65 120,75 112,65" />
  </g>
</svg>
