<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sushi Go Icon Preview</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, Arial; background:#f4f7f9; padding:20px; }
    h1 { font-size:18px; }
    .row { display:flex; gap:16px; align-items:flex-start; margin-bottom:12px; }
    .card { border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.08); padding:8px; display:flex; flex-direction:column; align-items:center; }
  </style>
</head>
<body>
  <h1>Sushi Go! Icon Preview</h1>
  <div class="row">
    <div class="card" style="width:128px;height:128px;background:#fff;">
      <img src="icon-nigiri-salmon.svg" width="96" height="96" alt="Nigiri Salmon" />
      <div>128×128</div>
    </div>
    <div class="card" style="width:110px;height:145px;background:#FFE4B5;">
      <img src="icon-nigiri-salmon.svg" width="85" height="65" alt="Hand" />
      <div>Hand 110×145</div>
    </div>
    <div class="card" style="width:72px;height:48px;background:#FFE4B5;">
      <img src="icon-nigiri-salmon.svg" width="44" height="24" alt="Tableau" />
      <div>Tableau 72×48</div>
    </div>
  </div>
  <p>Open this file through a static server (or place it in the same folder as the SVGs). Example: <code>python -m http.server</code>.</p>
</body>
</html>
