<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      App icon wiring (CG-0MUTTXRWZ009NUB9). The hrefs are deliberately
      base-relative (no leading slash, no dot-slash) so `public/` files copied
      verbatim by Vite resolve correctly under all three build bases: the
      GitHub Pages sub-path, the dev-server root, and Electron's file:// base.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <title>Tableau Card Engine</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <!--
      Client-side 404 redirect guard
      If the page is loaded from a nested file path (for example
      `/example-games/gym/index.html`) the dev server's SPA
      fallback returns index.html which can hide the fact the requested
      file doesn't exist. Redirect such requests to a dedicated
      /404.html page so users see a proper Not Found message instead of
      the app silently booting from the wrong base path.
    -->
    <script type="module">
      // Module-mode guard: we can safely read import.meta.env here.
      (function () {
        try {
          const path = window.location.pathname || '/';
          // Detect deep-linked example game file paths or other nested index.html
          if (/\/example-games\//.test(path) && !/^\/(|index\.html)$/.test(path)) {
            const base = (import.meta && import.meta.env && import.meta.env.BASE_URL) ? import.meta.env.BASE_URL : '/';
            const target = base + '404.html';
            // Avoid redirect loop if already at 404
            if (path !== new URL(target, window.location.origin).pathname) {
              window.location.replace(target);
              return;
            }
          }
        } catch (e) {
          // Fail closed: if the guard errors, continue booting the app.
          // eslint-disable-next-line no-console
          console.debug('[404-guard] check failed', e);
        }
      })();
    </script>

    <!--
      Suppress Vite HMR WebSocket ping errors in the browser console.
      These are harmless noise when accessing the dev server via Tailscale
      or other network proxies — the HMR client retries and reconnects
      automatically. We intercept only the specific error pattern so real
      console.error calls are unaffected.
    -->
    <script>
      (function () {
        // Guard against double-wrapping.
        if (window.__hmrErrorSuppressed) return;
        window.__hmrErrorSuppressed = true;
        var _origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = (args[0] || '');
          if (typeof msg === 'string' && /WebSocket connection to .+ failed: ping/.test(msg)) return;
          _origError.apply(console, args);
        };
      })();
    </script>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
