<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story-line editor · Tableau Card Engine</title>
    <!--
      Development tool only. This page is served by the dedicated editor host
      (`npm run storylines:editor`, root `tools/storyline-editor`, config
      `vite.editor.config.ts`) and is deliberately NOT referenced from the
      production game entry (`index.html` / `main.ts`) or the Electron package.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background: #0d0d16;
        color: #e8eaf4;
        min-height: 100vh;
      }
      #storyline-editor-app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .editor-shell {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
        padding: 16px 20px 24px;
        box-sizing: border-box;
      }
      .editor-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .editor-title {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.01em;
      }
      .editor-summary {
        margin: 4px 0 0;
        color: #9aa0c0;
        font-size: 13px;
      }
      .editor-toolbar-actions {
        display: flex;
        gap: 8px;
      }
      .editor-button {
        background: #23233a;
        border: 1px solid #3b3b60;
        color: #e8eaf4;
        border-radius: 8px;
        padding: 7px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .editor-button:hover {
        background: #2d2d4a;
      }
      .editor-button:focus-visible {
        outline: 2px solid #ffd166;
        outline-offset: 2px;
      }
      .editor-readonly-note {
        margin: 0;
        padding: 8px 12px;
        border-left: 3px solid #b98cff;
        background: #171727;
        color: #b9c0dd;
        font-size: 12px;
        border-radius: 6px;
      }
      .editor-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        flex: 1 1 auto;
        min-height: 520px;
      }
      .editor-graph {
        min-height: 520px;
        border: 1px solid #2b2b44;
        border-radius: 12px;
        overflow: hidden;
        background: #12121c;
      }
      .editor-sidebar {
        border: 1px solid #2b2b44;
        border-radius: 12px;
        background: #14141f;
        padding: 14px 16px;
        overflow: auto;
        font-size: 13px;
      }
      .editor-sidebar-title,
      .editor-legend-title {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa0c0;
      }
      .editor-sidebar-empty,
      .editor-details-note {
        color: #7d84a6;
        font-size: 12px;
      }
      .editor-details-name {
        margin: 0 0 2px;
        font-size: 16px;
      }
      .editor-details-id {
        margin: 0 0 10px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        color: #9aa0c0;
      }
      .editor-details-kind,
      .editor-details-storyline {
        margin: 0 0 6px;
        color: #c9cfeb;
      }
      .editor-details-meta,
      .editor-fields {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 4px 10px;
        margin: 12px 0;
      }
      .editor-details-meta dt,
      .editor-fields dt {
        color: #9aa0c0;
        font-size: 12px;
      }
      .editor-details-meta dd,
      .editor-fields dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .editor-field-row {
        display: contents;
      }
      .editor-details-section {
        margin: 14px 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa0c0;
      }
      .editor-links {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .editor-link-item {
        color: #d7dcf3;
      }
      .editor-legend {
        border-top: 1px solid #23233a;
        padding-top: 10px;
      }
      .editor-legend-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .editor-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #2b2b44;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        color: #c9cfeb;
        background: #171727;
        cursor: pointer;
      }
      .editor-legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: #b98cff;
      }
      .editor-message {
        margin: 48px auto;
        max-width: 640px;
        border: 1px solid #2b2b44;
        border-radius: 12px;
        background: #14141f;
        padding: 24px 28px;
      }
      .editor-message h1 {
        margin-top: 0;
        font-size: 20px;
      }
      .editor-message p {
        color: #b9c0dd;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="storyline-editor-app"></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
